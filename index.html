<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contagem de Equipe</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f4f4">

  <style>

    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      padding:20px;
      background:#f4f4f4;
    }

    .container{
      max-width:500px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:16px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
    }

    .setor{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:15px;
      gap:10px;
    }

    .nome{
      flex:1;
      font-size:18px;
      font-weight:bold;
    }

    .contador{
      width:40px;
      text-align:center;
      font-size:20px;
    }

    .botoes{
      display:flex;
      gap:8px;
    }

    button{
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:22px;
      font-weight:bold;
    }

    .mais,.menos{
      width:45px;
      height:45px;
      background:#e5e5e5;
    }

    .acoes{
      display:flex;
      gap:10px;
      margin-top:30px;
    }

    .acao-btn{
      flex:1;
      padding:15px;
      font-size:16px;
      background:#dcdcdc;
    }

    .total{
      margin-top:25px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
    }

    textarea{
      width:100%;
      margin-top:20px;
      height:180px;
      resize:none;
      padding:10px;
      font-size:16px;
      border-radius:10px;
      border:1px solid #ccc;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Contagem de Equipe</h1>

  <div id="setores"></div>

  <div class="total">
    Total: <span id="total">0</span>
  </div>

  <div class="acoes">
    <button class="acao-btn" onclick="copiarTexto()">📋 Copiar</button>
    <button class="acao-btn" onclick="resetar()">🔄 Resetar</button>
  </div>

  <textarea id="textoFinal" readonly></textarea>

</div>

<script>

const setores = [
  "Embalagem",
  "Selagem",
  "Monovia",
  "Redinha",
  "Abastecimento de cxs",
  "Diaristas"
];

let dados = JSON.parse(localStorage.getItem("contagemEquipe")) || {};

const container = document.getElementById("setores");

setores.forEach(nome => {

  if(dados[nome] === undefined){
    dados[nome] = 0;
  }

  const div = document.createElement("div");

  div.className = "setor";

  div.innerHTML = `
    <div class="nome">${nome}</div>

    <div class="botoes">

      <button class="menos" onclick="alterar('${nome}', -1)">-</button>

      <div class="contador" id="${nome}">
        ${dados[nome]}
      </div>

      <button class="mais" onclick="alterar('${nome}', 1)">+</button>

    </div>
  `;

  container.appendChild(div);

});

function alterar(nome, valor){

  dados[nome] += valor;

  if(dados[nome] < 0){
    dados[nome] = 0;
  }

  document.getElementById(nome).innerText = dados[nome];

  salvar();
  atualizarTexto();

}

function atualizarTexto(){

  let texto = "";
  let total = 0;

  setores.forEach(nome => {

    texto += `${nome}: ${dados[nome]}\n`;

    total += dados[nome];

  });

  texto += `\nTotal: ${total}`;

  document.getElementById("textoFinal").value = texto;
  document.getElementById("total").innerText = total;

}

function copiarTexto(){

  const texto = document.getElementById("textoFinal");

  navigator.clipboard.writeText(texto.value);

  alert("Texto copiado!");

}

function resetar(){

  setores.forEach(nome => {

    dados[nome] = 0;

    document.getElementById(nome).innerText = 0;

  });

  salvar();
  atualizarTexto();

}

function salvar(){

  localStorage.setItem("contagemEquipe", JSON.stringify(dados));

}

atualizarTexto();

if("serviceWorker" in navigator){

  navigator.serviceWorker.register("./service-worker.js");

}

</script>

</body>
</html>
