<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contagem de Equipe</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f4f4">

  <style>

    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      padding:20px;
      background:#f4f4f4;
    }

    .container{
      max-width:600px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:18px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:30px;
    }

    .setor{
      margin-bottom:25px;
      padding-bottom:20px;
      border-bottom:1px solid #ddd;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }

    .nome{
      font-size:18px;
      font-weight:bold;
    }

    .info{
      font-size:18px;
      font-weight:bold;
    }

    .barra-container{
      width:100%;
      height:18px;
      background:#ddd;
      border-radius:20px;
      overflow:hidden;
      margin-bottom:12px;
    }

    .barra{
      height:100%;
      width:0%;
      transition:0.2s;
    }

    .botoes{
      display:flex;
      gap:10px;
      justify-content:center;
    }

    button{
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:24px;
      font-weight:bold;
    }

    .mais,.menos{
      width:55px;
      height:55px;
      background:#e5e5e5;
    }

    .mais:disabled{
      background:#bdbdbd;
      cursor:not-allowed;
    }

    .acoes{
      display:flex;
      gap:12px;
      margin-top:30px;
    }

    .acao-btn{
      flex:1;
      padding:15px;
      font-size:16px;
      background:#dcdcdc;
    }

    .total{
      margin-top:30px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
    }

    textarea{
      width:100%;
      margin-top:25px;
      height:220px;
      resize:none;
      padding:15px;
      font-size:16px;
      border-radius:12px;
      border:1px solid #ccc;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📋 Contagem de Equipe</h1>

  <div id="setores"></div>

  <div class="total">
    👥 Total: <span id="total">0</span>
  </div>

  <div class="acoes">
    <button class="acao-btn" onclick="copiarTexto()">📋 Copiar</button>
    <button class="acao-btn" onclick="resetar()">🔄 Resetar</button>
  </div>

  <textarea id="textoFinal" readonly></textarea>

</div>

<script>

const setores = [

  {
    nome: "Embaladores",
    maximo: 30
  },

  {
    nome: "Selagem",
    maximo: 10
  },

  {
    nome: "Monovia",
    maximo: 4
  },

  {
    nome: "Redinha",
    maximo: 2
  },

  {
    nome: "Abastecimento de cxs",
    maximo: 3
  },

  {
    nome: "Diaristas",
    maximo: 5
  }

];

let dados = JSON.parse(localStorage.getItem("contagemEquipe")) || {};

const container = document.getElementById("setores");

setores.forEach((setor, index) => {

  if(dados[setor.nome] === undefined){
    dados[setor.nome] = 0;
  }

  const div = document.createElement("div");

  div.className = "setor";

  div.innerHTML = `

    <div class="topo">

      <div class="nome">
        ${setor.nome}
      </div>

      <div class="info" id="info-${index}">
        ${dados[setor.nome]} / ${setor.maximo}
      </div>

    </div>

    <div class="barra-container">

      <div
        class="barra"
        id="barra-${index}">
      </div>

    </div>

    <div class="botoes">

      <button
        class="menos"
        onclick="alterar(${index}, -1)">
        -
      </button>

      <button
        class="mais"
        id="mais-${index}"
        onclick="alterar(${index}, 1)">
        +
      </button>

    </div>

  `;

  container.appendChild(div);

});

function alterar(index, valor){

  const setor = setores[index];

  dados[setor.nome] += valor;

  if(dados[setor.nome] < 0){
    dados[setor.nome] = 0;
  }

  if(dados[setor.nome] > setor.maximo){
    dados[setor.nome] = setor.maximo;
  }

  atualizarVisual(index);

  salvar();
  atualizarTexto();

}

function atualizarVisual(index){

  const setor = setores[index];

  const valor = dados[setor.nome];

  const porcentagem =
    (valor / setor.maximo) * 100;

  const barra =
    document.getElementById(`barra-${index}`);

  barra.style.width = porcentagem + "%";

  if(porcentagem < 70){

    barra.style.background = "#4caf50";

  }else if(porcentagem < 100){

    barra.style.background = "#ff9800";

  }else{

    barra.style.background = "#f44336";

  }

  document.getElementById(`info-${index}`).innerText =
    `${valor} / ${setor.maximo}`;

  const botaoMais =
    document.getElementById(`mais-${index}`);

  botaoMais.disabled =
    valor >= setor.maximo;

}

function atualizarTexto(){

  let texto =
`📋 CONTAGEM DE EQUIPE

`;

  let total = 0;

  setores.forEach(setor => {

    const valor = dados[setor.nome];

    texto +=
`${setor.nome}: ${valor} / ${setor.maximo}
`;

    total += valor;

  });

  texto +=
`
👥 Total: ${total}`;

  document.getElementById("textoFinal").value = texto;

  document.getElementById("total").innerText = total;

}

function copiarTexto(){

  const texto =
    document.getElementById("textoFinal");

  navigator.clipboard.writeText(texto.value);

  alert("Texto copiado!");

}

function resetar(){

  setores.forEach((setor, index) => {

    dados[setor.nome] = 0;

    atualizarVisual(index);

  });

  salvar();
  atualizarTexto();

}

function salvar(){

  localStorage.setItem(
    "contagemEquipe",
    JSON.stringify(dados)
  );

}

setores.forEach((_, index) => {

  atualizarVisual(index);

});

atualizarTexto();

if("serviceWorker" in navigator){

  navigator.serviceWorker.register(
    "./service-worker.js"
  );

}

</script>

</body>
</html>
