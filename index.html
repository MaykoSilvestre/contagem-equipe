<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contagem de Equipe</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f4f4">

  <style>

    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      padding:20px;
      background:#f4f4f4;
    }

    .container{
      max-width:600px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:18px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .top-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    h1{
      margin:0;
      font-size:28px;
    }

    .config-btn{
      border:none;
      background:#e5e5e5;
      border-radius:12px;
      width:50px;
      height:50px;
      font-size:24px;
      cursor:pointer;
    }

    .setor{
      margin-bottom:20px;
      padding-bottom:15px;
      border-bottom:1px solid #ddd;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }

    .nome{
      font-size:18px;
      font-weight:bold;
    }

    .info{
      font-size:18px;
      font-weight:bold;
    }

    .botoes{
      display:flex;
      gap:10px;
      justify-content:center;
    }

    button{
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:24px;
      font-weight:bold;
    }

    .mais,.menos{
      width:55px;
      height:55px;
      background:#e5e5e5;
    }

    .mais:disabled{
      background:#bdbdbd;
      cursor:not-allowed;
    }

    .acoes{
      display:flex;
      gap:12px;
      margin-top:30px;
    }

    .acao-btn{
      flex:1;
      padding:15px;
      font-size:16px;
      background:#dcdcdc;
    }

    .total{
      margin-top:30px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
    }

    textarea{
      width:100%;
      margin-top:25px;
      height:220px;
      resize:none;
      padding:15px;
      font-size:16px;
      border-radius:12px;
      border:1px solid #ccc;
    }

    .modal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal-content{
      background:white;
      width:100%;
      max-width:500px;
      border-radius:18px;
      padding:20px;
      max-height:90vh;
      overflow:auto;
    }

    .config-item{
      margin-bottom:20px;
      border-bottom:1px solid #ddd;
      padding-bottom:15px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:8px;
      margin-bottom:8px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
    }

    .remove-btn{
      background:#ff4d4d;
      color:white;
      padding:10px;
      width:100%;
      font-size:16px;
    }

    .save-btn{
      background:#4caf50;
      color:white;
      padding:15px;
      width:100%;
      font-size:18px;
      margin-top:15px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="top-header">

    <h1>📋 Contagem</h1>

    <button
      class="config-btn"
      onclick="abrirConfig()">
      ⚙️
    </button>

  </div>

  <div id="setores"></div>

  <div class="total">
    👥 Total: <span id="total">0</span>
  </div>

  <div class="acoes">
    <button class="acao-btn" onclick="copiarTexto()">📋 Copiar</button>
    <button class="acao-btn" onclick="resetar()">🔄 Resetar</button>
  </div>

  <textarea id="textoFinal" readonly></textarea>

</div>

<div class="modal" id="modal">

  <div class="modal-content">

    <h2>⚙️ Configurações</h2>

    <div id="configLista"></div>

    <button
      class="acao-btn"
      onclick="adicionarSetor()">
      + Adicionar setor
    </button>

    <button
      class="save-btn"
      onclick="salvarConfiguracoes()">
      Salvar alterações
    </button>

  </div>

</div>

<script>

let setores =
JSON.parse(localStorage.getItem("setores")) || [

  {
    nome:"Embaladores",
    maximo:30
  },

  {
    nome:"Selagem",
    maximo:10
  },

  {
    nome:"Monovia",
    maximo:4
  }

];

let dados =
JSON.parse(localStorage.getItem("contagemEquipe")) || {};

function renderizar(){

  const container =
  document.getElementById("setores");

  container.innerHTML = "";

  let total = 0;

  setores.forEach((setor,index)=>{

    if(dados[setor.nome] === undefined){
      dados[setor.nome] = 0;
    }

    total += dados[setor.nome];

    const div =
    document.createElement("div");

    div.className = "setor";

    div.innerHTML = `

      <div class="topo">

        <div class="nome">
          ${setor.nome}
        </div>

        <div class="info">
          ${dados[setor.nome]} / ${setor.maximo}
        </div>

      </div>

      <div class="botoes">

        <button
          class="menos"
          onclick="alterar(${index},-1)">
          -
        </button>

        <button
          class="mais"
          onclick="alterar(${index},1)"
          ${dados[setor.nome] >= setor.maximo ? "disabled" : ""}>
          +
        </button>

      </div>

    `;

    container.appendChild(div);

  });

  document.getElementById("total").innerText = total;

  atualizarTexto();

}

function alterar(index,valor){

  const setor = setores[index];

  dados[setor.nome] += valor;

  if(dados[setor.nome] < 0){
    dados[setor.nome] = 0;
  }

  if(dados[setor.nome] > setor.maximo){
    dados[setor.nome] = setor.maximo;
  }

  salvarDados();

  renderizar();

}

function atualizarTexto(){

  let texto =
`📋 CONTAGEM DE EQUIPE

`;

  let total = 0;

  setores.forEach(setor=>{

    const valor =
    dados[setor.nome];

    texto +=
`${setor.nome}: ${valor} / ${setor.maximo}
`;

    total += valor;

  });

  texto +=
`
👥 Total: ${total}`;

  document.getElementById("textoFinal").value =
  texto;

}

function copiarTexto(){

  const texto =
  document.getElementById("textoFinal");

  navigator.clipboard.writeText(texto.value);

  alert("Texto copiado!");

}

function resetar(){

  setores.forEach(setor=>{

    dados[setor.nome] = 0;

  });

  salvarDados();

  renderizar();

}

function salvarDados(){

  localStorage.setItem(
    "contagemEquipe",
    JSON.stringify(dados)
  );

}

function abrirConfig(){

  document.getElementById("modal")
  .style.display = "flex";

  renderizarConfig();

}

function fecharConfig(){

  document.getElementById("modal")
  .style.display = "none";

}

function renderizarConfig(){

  const lista =
  document.getElementById("configLista");

  lista.innerHTML = "";

  setores.forEach((setor,index)=>{

    const div =
    document.createElement("div");

    div.className = "config-item";

    div.innerHTML = `

      <input
        type="text"
        value="${setor.nome}"
        id="nome-${index}">

      <input
        type="number"
        value="${setor.maximo}"
        id="maximo-${index}">

      <button
        class="remove-btn"
        onclick="removerSetor(${index})">
        🗑 Remover
      </button>

    `;

    lista.appendChild(div);

  });

}

function adicionarSetor(){

  setores.push({

    nome:"Novo setor",
    maximo:1

  });

  renderizarConfig();

}

function removerSetor(index){

  setores.splice(index,1);

  renderizarConfig();

}

function salvarConfiguracoes(){

  setores.forEach((setor,index)=>{

    setor.nome =
    document.getElementById(`nome-${index}`).value;

    setor.maximo =
    Number(
      document.getElementById(`maximo-${index}`).value
    );

  });

  localStorage.setItem(
    "setores",
    JSON.stringify(setores)
  );

  salvarDados();

  fecharConfig();

  renderizar();

}

window.onclick = function(event){

  const modal =
  document.getElementById("modal");

  if(event.target == modal){

    fecharConfig();

  }

}

renderizar();

if("serviceWorker" in navigator){

  navigator.serviceWorker.register(
    "./service-worker.js"
  );

}

</script>

</body>
</html>
